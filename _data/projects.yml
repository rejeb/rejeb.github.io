- slug: dataform-plugin
  dir: dataform-intellij-plugin
  name: Google Cloud Dataform Plugin for IntelliJ
  short: DF
  ws: Dataform
  install:
    where: Settings ▸ Plugins
    steps:
      - In IntelliJ IDEA, open **Settings ▸ Plugins ▸ Marketplace**.
      - Search for **Dataform** and install the plugin.
      - Restart the IDE.
    note: >-
      Requires IntelliJ IDEA Ultimate 2026.2+, Node.js, and the Dataform CLI and Core, which the plugin can
      install for you.
  logo: /assets/img/dataform/logo.svg
  color: "#6366f1"
  tagline: Write, navigate, run and debug Dataform SQLX pipelines without leaving IntelliJ IDEA.
  kind: IntelliJ plugin
  tags: [java, intellij, bigquery, gcp]
  version: v1.0.0
  version_source: jetbrains/plugin/v/30020
  license: Apache-2.0
  category: DeveloperApplication
  os: Windows, Linux (IntelliJ IDEA Ultimate 2026.2+)
  language: Java
  image: /assets/img/og/og-dataform-plugin.png
  url: /dataform-plugin
  docs: /dataform-plugin/docs
  features: /dataform-plugin/features
  repo: https://github.com/rejeb/google-cloud-dataform-plugin
  extra:
    - label: JetBrains Marketplace
      url: https://plugins.jetbrains.com/plugin/30020
  screenshots:
    - src: /assets/img/dataform/lineage-selection.webp
      caption: Project lineage with a selected action
    - src: /assets/img/dataform/preview-assertions.webp
      caption: Compiled preview with assertions and cost
    - src: /assets/img/dataform/errors-inline.webp
      caption: BigQuery dry-run errors in place
    - src: /assets/img/dataform/run-jobs.webp
      caption: Run console with the BigQuery jobs timeline
    - src: /assets/img/dataform/impact-analysis.webp
      caption: Column impact analysis on save
    - src: /assets/img/dataform/panel-changes.webp
      caption: Dataform Tools tool window
    - src: /assets/img/dataform/unit-test-failed.webp
      caption: Unit tests in the IDE test runner
  snippet_file: users.sqlx
  snippet: |
    config {
      type: "table",
      tags: ["daily"]
    }

    SELECT user_id, country
    FROM ${ref("raw_users")}
    -- folds to: my-project.raw.raw_users
- slug: linux-thermalright-lcd-control
  dir: linux-thermalright-lcd-control
  name: Thermalright LCD Control For Linux
  short: TR
  ws: Thermalright
  install:
    where: DNF · APT · Tarball
    steps:
      - Add the openSUSE Build Service repository for your distribution.
      - Install the `thermalright-lcd-control` package.
      - Start **Thermalright LCD Control**. It then starts with your session, minimized to the tray.
    note: >-
      Packages for Fedora, Debian, Ubuntu and atomic distributions (Bazzite, Silverblue), plus a tarball for
      any other distribution. The packages bundle their own Python runtime.
  logo: /assets/img/tr-logo.png
  color: "#e11d48"
  tagline: Drive Thermalright cooler LCD screens and RGB LEDs on Linux, with themes, widgets and live hardware metrics.
  kind: Linux desktop app
  tags: [python, qt, linux, usb]
  version: v2.1.1
  version_source: github/v/release/rejeb/linux-thermalright-lcd-control
  license: Apache-2.0
  category: UtilitiesApplication
  os: Linux (Fedora, Debian, Ubuntu)
  language: Python
  image: /assets/img/og/og-linux-thermalright-lcd-control.png
  url: /linux-thermalright-lcd-control
  docs: /linux-thermalright-lcd-control/docs
  repo: https://github.com/rejeb/linux-thermalright-lcd-control
  screenshots:
    - src: /assets/img/tr-device-configuration.webp
      caption: Device configuration
    - src: /assets/img/tr-themes.webp
      caption: Theme presets
    - src: /assets/img/tr-wigdets.webp
      caption: Widget editor
    - src: /assets/img/tr-bg.webp
      caption: Backgrounds
    - src: /assets/img/tr-foreground.webp
      caption: Foregrounds
  snippet_file: terminal
  snippet: |
    $ sudo dnf install thermalright-lcd-control
    $ thermalright-lcd-control
    [ok] device 0402:3922 detected
    [ok] widgets: cpu.temp gpu.usage clock
- slug: netcdf-spark-parser
  dir: netcdf-spark-parser
  name: NetCDF Spark Parser
  short: NC
  ws: NetCDF
  install:
    where: sbt · Maven Central
    steps:
      - 'Add `"io.github.rejeb" %% "netcdf-spark-parser" % "1.0.0"` to `libraryDependencies` in `build.sbt`.'
      - 'Read a file with `spark.read.format("netcdf")`, a schema and the `path` option.'
    note: Requires Java 11+, Apache Spark 3.5.x and Scala 2.12 or 2.13.
  color: "#0891b2"
  tagline: A Spark DataSource V2 connector that reads NetCDF scientific files as DataFrames, at scale.
  kind: Spark connector
  tags: [scala, spark, netcdf, s3]
  version: v1.0.0
  version_source: maven-central/v/io.github.rejeb/netcdf-spark-parser_2.13
  license: Apache-2.0
  category: DeveloperApplication
  os: Any (JVM, Apache Spark 3.5)
  language: Scala
  image: /assets/img/og/og-netcdf-spark-parser.png
  url: /netcdf-spark-parser
  docs: /netcdf-spark-parser/docs
  repo: https://github.com/rejeb/netcdf-spark-parser
  snippet_file: Main.scala
  snippet: |
    // build.sbt
    // "io.github.rejeb" %% "netcdf-spark-parser" % "1.0.0"

    val df = spark.read
      .format("netcdf")
      .schema(schema)
      .option("path", "s3://climate/era5.nc")
      .load()
